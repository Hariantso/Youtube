<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Cartes Devpulse</title>

    <style>
        :root {
            --bg: #0c0d14;
            --card: #171925;
            --txt: #f2f3ff;
            --sub: #8b90ad;
            box-sizing: border-box;
            padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
        }

        @media(prefers-color-scheme:light) {
            :root:not([data-theme="dark"]) {
                --bg: #eceef7;
                --card: #fff;
                --txt: #161833;
                --sub: #6b7090;
            }
        }

        :root[data-theme="dark"] {
            --bg: #0c0d14;
            --card: #171925;
            --txt: #f2f3ff;
            --sub: #8b90ad;
        }

        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-wrap: wrap;
            gap: 36px;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            background: radial-gradient(circle at 50% 0, #6c5ce744, transparent 60%), var(--bg);
            color: var(--txt);
            font-family: "Trebuchet MS", sans-serif;
        }

        .card {
            width: 240px;
            padding: 22px;
            border-radius: 26px;
            background: var(--card);
            position: relative;
            transform-style: preserve-3d;
            transform: perspective(800px) rotateX(var(--x, 0deg)) rotateY(var(--y, 0deg));
            transition: transform .15s, box-shadow .3s;
            box-shadow: 0 20px 40px #0004, 0 0 0 1px #ffffff14 inset;
            touch-action: none;
        }

        .card.out {
            transition: transform .6s cubic-bezier(.2, 1.4, .4, 1);
        }

        .card:hover {
            box-shadow: 0 40px 70px -10px var(--c), 0 0 0 1px #ffffff22 inset;
        }

        .card::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            opacity: 0;
            transition: opacity .3s;
            background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), #ffffff40, transparent 55%);
        }

        .card:hover::after {
            opacity: 1;
        }

        .pic {
            height: 170px;
            border-radius: 18px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--c), var(--d));
            transform: translateZ(30px);
            box-shadow: 0 18px 30px -10px var(--c);
        }

        .pic svg {
            width: 84px;
            fill: none;
            stroke: #fff;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
            transform: translateZ(40px);
            filter: drop-shadow(0 12px 10px #0005);
        }

        h3 {
            margin: 20px 0 4px;
            transform: translateZ(25px);
        }

        p {
            color: var(--sub);
            font-size: 14px;
            transform: translateZ(15px);
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            transform: translateZ(35px);
        }

        b {
            font-size: 22px;
        }

        button {
            border: 0;
            padding: 10px 16px;
            border-radius: 14px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, var(--c), var(--d));
        }
    </style>
</head>

<body>

    <script>
        const items = [
            [
                "Casque Nova",
                "Réduction de bruit active",
                "129 €",
                "#6c5ce7",
                "#a29bfe",
                "M4 15v-3a8 8 0 0116 0v3M4 15h3v5H4zM17 15h3v5h-3z"
            ],
            [
                "Montre Orbit",
                "Suivi santé & GPS",
                "199 €",
                "#00b894",
                "#55efc4",
                "M9 3h6l1 4H8zM8 17h8l-1 4H9zM12 7a5 5 0 100 10 5 5 0 000-10zM12 10v2l1.5 1"
            ],
            [
                "Appareil Lumo",
                "Capteur 48 MP, vidéo 4K",
                "449 €",
                "#ff7675",
                "#fdcb6e",
                "M3 8h4l2-3h6l2 3h4v11H3zM12 10a3.5 3.5 0 100 7 3.5 3.5 0 000-7z"
            ]
        ];

        items.forEach(([n, d, p, c, e, path]) => {

            const el = document.createElement('div');
            el.className = 'card';
            el.style.cssText = `--c:${c};--d:${e}`;

            el.innerHTML = `
                <div class="pic">
                    <svg viewBox="0 0 24 24">
                        <path d="${path}"/>
                    </svg>
                </div>

                <h3>${n}</h3>

                <p>${d}</p>

                <div class="row">
                    <b>${p}</b>
                    <button>Ajouter</button>
                </div>
            `;

            el.onpointermove = ev => {

                const r = el.getBoundingClientRect();
                const x = (ev.clientX - r.left) / r.width;
                const y = (ev.clientY - r.top) / r.height;

                el.classList.remove('out');

                el.style.setProperty('--x', (.5 - y) * 22 + 'deg');
                el.style.setProperty('--y', (x - .5) * 22 + 'deg');

                el.style.setProperty('--mx', x * 100 + '%');
                el.style.setProperty('--my', y * 100 + '%');
            };

            el.onpointerleave = () => {

                el.classList.add('out');

                el.style.setProperty('--x', '0deg');
                el.style.setProperty('--y', '0deg');
            };

            document.body.append(el);
        });
    </script>

</body>

</html>
